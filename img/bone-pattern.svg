    <use href="#bone-b" stroke-width="2" vector-effect="non-scaling-stroke" transform="translate(292 176) rotate(36 30 15) scale(1)"/>
    <use href="#bone-c" stroke-width="2.4" vector-effect="non-scaling-stroke" transform="translate(126 346) rotate(10 24 15) scale(1.05)"/>
  </g>
</svg>
